name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify 2>&1 | tee build.log; exit "${PIPESTATUS[0]}"
      - name: Report failures as annotations
        if: failure()
        run: |
          # Compiler errors and test failures, so they show on the PR without opening the log.
          grep -E '^\[ERROR\]' build.log | grep -vE 'To see the full stack|Re-run Maven|For more information|Help 1|^\[ERROR\] *$|-> \[Help' \
            | head -40 | sed 's/^\[ERROR\] */::error::/'
