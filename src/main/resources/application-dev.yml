# Local development: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Plain http://localhost, so the session cookie can't be Secure. Never use this profile on a server.
server:
  servlet:
    session:
      cookie:
        secure: false
casita:
  security:
    # No reverse proxy locally: a request straight to 127.0.0.1 is "this computer" (rp-id localhost only).
    device-identity: development
