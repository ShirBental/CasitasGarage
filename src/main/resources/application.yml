spring:
  application:
    name: casita

server:
  # Never listen on a public interface: 'tailscale serve' publishes Casita to the tailnet.
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      # Sessions live in memory: a restart signs everyone out (Face ID signs them back in). Until the
      # design's remember-me lands, an idle session ends after a week.
      timeout: 7d
      cookie:
        http-only: true
        secure: true          # the dev profile turns this off for plain http://localhost
        same-site: lax        # lax, so opening Casita from a notification or Shortcut keeps the session

casita:
  # Which door Casita talks to: 'simulated' (pretend door) or 'meross' (the real one).
  door: simulated
  security:
    # Passkeys are bound to this host name. Production: the Tailscale name, e.g.
    # casita.<tailnet>.ts.net, with allowed-origins https://casita.<tailnet>.ts.net.
    rp-id: localhost
    allowed-origins: [http://localhost:8080]
    # Who may sign in, by short name. Nobody else can, even with an invite link.
    family: []
    # Passkeys (public keys only) and invite links; outside git, readable by Casita's user only.
    data-dir: data
  meross:
    api-base-url: https://iotx-us.meross.com
    # email / password: from the environment for now (CASITA_MEROSS_EMAIL, CASITA_MEROSS_PASSWORD),
    # or locally from the git-ignored config/meross.local.json (docs/MEROSS.md); the environment wins.
    # They move to Parameter Store next. Never put them in this file.
    # device-uuid: only needed if the account has more than one garage opener.
    # The opener's doors, by channel. Our MSG200 reports channels 1-3; channel 3 is disabled.
    doors:
      1: Ford
      2: Toyota
    # channel: which of those doors this Casita reads (1 = Ford, 2 = Toyota). Required with the real
    # door: there is no default, and an MSG200 has no channel 0. Set it with CASITA_MEROSS_CHANNEL.
    request-timeout: 8s
    # Sending open/close to the real door: off (every command rejected before anything is built),
    # dry-run (checked and built, never sent) or live. Keep off until the hardware prerequisites in
    # docs/DESIGN.md are checked. Live also needs 'channel' set and listed in command-channels.
    command-mode: "off"     # quoted: YAML reads a bare off as false
    # The only doors that may be sent a command. Ford first; Toyota and channel 3 are not operated yet.
    command-channels: [1]
  garage:
    travel-time: 10s        # how long our door takes to fully open or close
    verify-grace: 2s        # extra wait before checking it got there
    allow-remote-close: true
