spring:
  application:
    name: casita

server:
  # Never listen on a public interface: 'tailscale serve' publishes Casita to the tailnet.
  address: 127.0.0.1
  port: 8080

casita:
  # Which door Casita talks to: 'simulated' (pretend door) or 'meross' (the real one).
  door: simulated
  meross:
    api-base-url: https://iotx-us.meross.com
    # email / password: from the environment for now (CASITA_MEROSS_EMAIL, CASITA_MEROSS_PASSWORD);
    # they move to Parameter Store next. Never put them in this file.
    # device-uuid: only needed if the account has more than one garage opener.
    channel: 0
    request-timeout: 8s
  garage:
    travel-time: 10s        # how long our door takes to fully open or close
    verify-grace: 2s        # extra wait before checking it got there
    allow-remote-close: true
