<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Casita">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Casita</title>
  <link rel="stylesheet" href="/casita.css">
</head>
<body class="home">
  <main>
    <header class="top">
      <span class="wordmark">Casita</span>
      <button id="account-open" class="avatar" type="button" aria-label="Account">
        <img src="/watson.svg" alt="" width="34" height="34"><span class="dot" id="setup-dot"></span>
      </button>
    </header>
    <p class="tag" id="mode"></p>

    <section class="ford" id="door" aria-live="polite">
      <p class="name" id="door-name">Ford</p>
      <p class="state" id="door-state">One moment…</p>
      <p class="detail" id="door-detail"></p>
      <div class="estimate" id="estimate">
        <div class="track"><div class="fill" id="estimate-fill"></div></div>
        <p id="estimate-label"></p>
      </div>
      <p class="result" id="result"></p>
    </section>

    <div class="spacer"></div>

    <div class="watched" id="watched"></div>
    <button class="row last" id="history-open" type="button">
      <span id="last-event">No history yet</span><span class="when" id="last-when"></span>
    </button>

    <div class="action">
      <button id="act" class="act" type="button" disabled>One moment…</button>
    </div>
  </main>

  <dialog id="history" class="sheet" aria-labelledby="history-title">
    <div class="sheet-head"><h2 id="history-title">History</h2><button class="close" type="button" data-close>Done</button></div>
    <ul id="activity"></ul>
  </dialog>

  <dialog id="account" class="sheet" aria-labelledby="account-title">
    <div class="sheet-head"><h2 id="account-title">Casita</h2><button class="close" type="button" data-close>Done</button></div>
    <p class="household" id="household"></p>
    <p class="signed-in" id="signed-in"></p>
    <a class="sheet-link" id="setup" href="/passkey">Set up Face ID on this phone</a>
    <button id="signout" class="sheet-link" type="button">Sign out</button>
    <p class="about" id="about"></p>
  </dialog>

  <script src="/common.js"></script>
  <script src="/voice.js"></script>
  <script src="/app.js"></script>
</body>
</html>
