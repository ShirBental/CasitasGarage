<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Casita">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Casita</title>
  <link rel="stylesheet" href="/casita.css">
</head>
<body class="home">
  <main>
    <header class="top">
      <span class="wordmark">Casita</span>
      <span class="tag" id="mode"></span>
      <button id="account-open" class="account" type="button" aria-label="Account">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg>
      </button>
    </header>

    <!-- Two doors, one house. Watson (the approved casita.brand.illustration) rests his chin on the line
         above Ford, looking over both doors; Ford and Toyota sit together below him, filled in by app.js.
         A quarter of the spare height goes above him and the rest below the doors. -->
    <div class="spare" id="spare-above"></div>
    <div class="doors" id="doors">
      <figure class="companion" id="companion" hidden><img id="companion-art" alt=""></figure>
      <div class="hairline"></div>
      <section class="door" id="door-0" aria-live="polite"></section>
      <div class="hairline"></div>
      <section class="door" id="door-1" aria-live="polite"></section>
    </div>
    <div class="spare below" id="spare-below"></div>

    <section class="offline" id="offline" hidden aria-live="polite">
      <p class="state" id="offline-word"></p>
      <p class="detail" id="offline-detail"></p>
      <p class="waiting" id="offline-button"></p>
    </section>

    <button class="row last" id="history-open" type="button">
      <span id="last-event"></span><span class="when" id="last-when"></span>
    </button>
  </main>

  <template id="door-template">
    <div class="door-text">
      <h2 class="name"></h2>
      <p class="state"><span class="dot" aria-hidden="true"></span><span class="word"></span></p>
      <p class="detail"></p>
      <div class="feedback">
        <div class="estimate"><div class="track"><div class="fill"></div></div><span>Estimated</span></div>
        <p class="result"></p>
      </div>
      <p class="note"></p>
      <button class="checked link" type="button" hidden></button>
    </div>
    <button class="go" type="button" disabled></button>
  </template>

  <dialog id="history" class="sheet" aria-labelledby="history-title">
    <div class="sheet-head"><h2 id="history-title">History</h2><button class="close" type="button" data-close>Done</button></div>
    <ul id="activity"></ul>
  </dialog>

  <dialog id="account" class="sheet" aria-labelledby="account-title">
    <div class="sheet-head"><h2 id="account-title">Casita</h2><button class="close" type="button" data-close>Done</button></div>
    <p class="household" id="household"></p>
    <p class="signed-in" id="signed-in"></p>
    <button id="signout" class="sheet-link" type="button">Sign out</button>
    <p class="about" id="about"></p>
  </dialog>

  <script src="/common.js"></script>
  <script src="/voice.js"></script>
  <script src="/app.js"></script>
</body>
</html>
