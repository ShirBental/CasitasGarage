<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ed">
  <title>Casita: Face ID</title>
  <link rel="stylesheet" href="/casita.css">
</head>
<body class="welcome">
  <main>
    <img class="watson" src="/watson.svg" alt="Watson" width="132" height="132">
    <h1>Welcome home</h1>
    <p class="voice">Let's set up Face ID on this phone, so you can sign in with just a glance.</p>
    <p class="success" id="success">All set! This phone can use Casita now. <a href="/login">Sign in with Face ID</a></p>
    <p class="error" id="error"></p>
    <label class="field">Name this phone
      <input id="label" type="text" value="iPhone" maxlength="40" autocomplete="off">
    </label>
    <button id="register" class="primary" type="button">Set up Face ID</button>
    <p class="note">Already have a Casita passkey from another Apple device? <a href="/login">Sign in with it here</a>, and this phone is set up too.</p>
  </main>
  <script src="/login/webauthn.js"></script>
  <script src="/common.js"></script>
  <script src="/passkey.js"></script>
</body>
</html>
